[tool.poetry]
name = "app"
version = "0.1.0"
description = "PostBot 3000 - LangGraph FastAPI Agent Service"
authors = ["Muhammad Ahmad <ahmadshaukat_4@outlook.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.3"}
langchain = "^0.3.1"
langchain-core = "^0.3.6"
openai = "^1.50.2"
langchain-openai = "^0.2.1"
langchain-groq = "^0.2.0"
langchain-google-genai = "^2.0.0"
langgraph = "^0.2.28"
langserve = {extras = ["all"], version = "^0.3.0"}
pydantic = "^2.9.2"
python-dotenv = "^1.0.1"
httpx = "^0.27.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry-core.masonry.api"
