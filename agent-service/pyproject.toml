[project]
name = "postbot-agent-service"
version = "0.1.0"
description = "PostBot 3000 - LangGraph FastAPI Agent Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.30.3,<0.32",
    "langchain>=0.3.1,<0.4",
    "langchain-core>=0.3.6,<0.4",
    "openai>=1.50.2,<2.0",
    "langchain-openai>=0.2.1,<0.3",
    "langchain-groq>=0.2.0,<0.3",
    "langchain-google-genai>=2.0.0,<2.2",
    "langgraph>=0.2.28,<0.3",
    "langserve[all]>=0.3.0,<0.4",
    "pydantic>=2.9.2,<2.11",
    "python-dotenv>=1.0.1,<2.0",
    "httpx>=0.27.2,<0.28",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
